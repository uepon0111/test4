<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>オーディオライブラリ</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/player.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/log.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/responsive.css" />

<body>
  <div id="app" class="app-shell landscape">
    <aside id="tabRail" class="tab-rail" aria-label="メインタブ"></aside>

      <section id="screen-log" class="screen screen-log" aria-label="ログ画面"></section>
      <section id="screen-settings" class="screen screen-settings" aria-label="設定画面"></section>
    </main>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="js/main.js"></script>
