<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>プロセカ リザルト管理</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app" class="app">

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-left">
      <button class="icon-btn" id="menu-toggle" aria-label="メニューを開く">
        <span class="material-icons-round">menu</span>
      </button>
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">リザルト管理</span>
      </div>
    </div>
    <div class="header-center" id="header-mode-display">
      <button class="mode-pill" id="mode-pill-btn">
        <span class="material-icons-round" style="font-size:14px">tune</span>
        <span id="mode-pill-label">AP基準</span>
      </button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="auth-btn" aria-label="Googleアカウント">
        <span class="material-icons-round" id="auth-icon">account_circle</span>
      </button>
    </div>
  </header>

  <!-- Sidebar overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">リザルト管理</span>
      </div>
      <button class="icon-btn" id="sidebar-close" aria-label="メニューを閉じる">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="list">
        <span class="material-icons-round">grid_view</span>
        <span>リザルト一覧</span>
      </button>
      <button class="nav-item" data-view="trash">
        <span class="material-icons-round">delete_outline</span>
        <span>ゴミ箱</span>
        <span class="nav-badge" id="trash-count-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="material-icons-round">settings</span>
        <span>設定</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div id="auth-status-sidebar" class="auth-status">
        <span class="material-icons-round">account_circle</span>
        <span id="auth-label-sidebar">未ログイン</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="main">

    <!-- ========== LIST VIEW ========== -->
    <div class="view active" id="view-list">

      <!-- Control bar -->
      <div class="control-bar" id="control-bar">
        <div class="search-row">
          <div class="search-box">
            <span class="material-icons-round search-icon">search</span>
            <input type="text" id="search-input" placeholder="楽曲名・読みで検索" class="search-input" autocomplete="off">
            <button class="icon-btn clear-btn" id="search-clear" style="display:none">
              <span class="material-icons-round">close</span>
            </button>
          </div>
          <button class="filter-toggle-btn" id="filter-toggle-btn">
            <span class="material-icons-round">filter_list</span>
            <span>絞り込み</span>
          </button>
        </div>

        <!-- Filter Panel (collapsible) -->
        <div class="filter-panel" id="filter-panel" style="display:none">
          <!-- Difficulty -->
          <div class="filter-section">
            <div class="filter-section-label">難易度</div>
            <div class="diff-chip-row" id="difficulty-chips">
              <button class="diff-chip active" data-diff="EASY">EASY</button>
              <button class="diff-chip active" data-diff="NORMAL">NORMAL</button>
              <button class="diff-chip active" data-diff="HARD">HARD</button>
              <button class="diff-chip active" data-diff="EXPERT">EXPERT</button>
              <button class="diff-chip active" data-diff="MASTER">MASTER</button>
              <button class="diff-chip active" data-diff="APPEND">APPEND</button>
            </div>
          </div>

          <!-- Level range -->
          <div class="filter-section">
            <div class="filter-section-label">楽曲レベル範囲</div>
            <div class="range-row">
              <input type="number" id="level-min" class="range-input" placeholder="最小" min="1" max="45">
              <span class="range-sep">〜</span>
              <input type="number" id="level-max" class="range-input" placeholder="最大" min="1" max="45">
            </div>
          </div>

          <!-- Achievement -->
          <div class="filter-section">
            <div class="filter-section-label">達成状況</div>
            <div class="chip-row" id="achievement-chips">
              <button class="chip active" data-ach="all">すべて</button>
              <button class="chip" data-ach="ap">AP済み</button>
              <button class="chip" data-ach="fc">FC済み</button>
              <button class="chip" data-ach="none">未FC</button>
            </div>
          </div>

          <!-- Miss range -->
          <div class="filter-section" id="miss-range-section">
            <div class="filter-section-label">ミス数範囲 <span class="mode-hint" id="miss-range-mode-hint">(AP基準)</span></div>
            <div class="range-row">
              <input type="number" id="miss-min" class="range-input" placeholder="最小" min="0">
              <span class="range-sep">〜</span>
              <input type="number" id="miss-max" class="range-input" placeholder="最大" min="0">
            </div>
          </div>

          <button class="text-btn" id="filter-reset-btn" style="margin-top:8px">
            <span class="material-icons-round">refresh</span> 絞り込みをリセット
          </button>
        </div>

        <!-- Sort & View row -->
        <div class="sort-row">
          <div class="sort-group">
            <select class="sort-select" id="sort-by">
              <option value="date">追加日順</option>
              <option value="name">楽曲名順</option>
              <option value="level">楽曲レベル順</option>
              <option value="miss">ミス数順</option>
            </select>
            <button class="icon-btn sort-order-btn" id="sort-order-btn" title="昇順/降順切替">
              <span class="material-icons-round" id="sort-order-icon">arrow_downward</span>
            </button>
          </div>
          <div class="view-toggle-group">
            <button class="view-toggle-btn active" data-show="all" id="show-all-btn">すべて</button>
            <button class="view-toggle-btn" data-show="ap" id="show-best-ap-btn">AP自己ベスト</button>
            <button class="view-toggle-btn" data-show="fc" id="show-best-fc-btn">FC自己ベスト</button>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <span id="stats-text" class="stats-text">0件</span>
          <div class="mode-chips" id="mode-chips">
            <button class="mode-chip active" data-mode="ap" id="mode-chip-ap">AP</button>
            <button class="mode-chip" data-mode="ap-tournament" id="mode-chip-tournament">大会</button>
            <button class="mode-chip" data-mode="fc" id="mode-chip-fc">FC</button>
          </div>
        </div>
      </div>

      <!-- Card list (virtual scroll manages DOM inside here) -->
      <div class="card-list-container" id="card-list-container"></div>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="empty-icon-wrap">
          <span class="material-icons-round empty-icon">music_note</span>
        </div>
        <p class="empty-title">リザルトがありません</p>
        <p class="empty-desc">右下の + ボタンから画像をアップロードしてください</p>
      </div>
    </div>

    <!-- ========== TRASH VIEW ========== -->
    <div class="view" id="view-trash" style="display:none">
      <div class="view-header">
        <h2 class="view-title">ゴミ箱</h2>
        <button class="danger-text-btn" id="empty-all-trash-btn">すべて完全削除</button>
      </div>
      <p class="view-desc">削除から3日後に自動で完全削除されます</p>
      <div id="trash-list" class="trash-list"></div>
      <div class="empty-state" id="trash-empty-state" style="display:none">
        <span class="material-icons-round empty-icon">delete_sweep</span>
        <p class="empty-title">ゴミ箱は空です</p>
      </div>
    </div>

    <!-- ========== SETTINGS VIEW ========== -->
    <div class="view" id="view-settings" style="display:none">
      <div class="settings-content" id="settings-content">
        <!-- Rendered by settings.js -->
      </div>
    </div>

  </main>

  <!-- FAB -->
  <button class="fab" id="upload-fab" aria-label="リザルトを追加">
    <span class="material-icons-round">add</span>
  </button>
</div>

<!-- ========== MODALS ========== -->

<!-- Image Viewer -->
<div class="modal-overlay" id="viewer-overlay" style="display:none">
  <div class="modal viewer-modal">
    <button class="modal-close-btn" id="viewer-close">
      <span class="material-icons-round">close</span>
    </button>
    <div class="viewer-image-wrap">
      <img id="viewer-img" src="" alt="リザルト画像" class="viewer-img">
    </div>
    <div class="viewer-info" id="viewer-info"></div>
    <div class="viewer-actions">
      <button class="icon-text-btn" id="viewer-edit-btn">
        <span class="material-icons-round">edit</span> 編集
      </button>
      <button class="icon-text-btn danger" id="viewer-delete-btn">
        <span class="material-icons-round">delete</span> 削除
      </button>
    </div>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="upload-overlay" style="display:none">
  <div class="modal upload-modal">
    <div class="modal-header">
      <h3 class="modal-title" id="upload-modal-title">リザルト追加</h3>
      <button class="modal-close-btn" id="upload-close">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="modal-body" id="upload-body">
      <!-- Step content rendered by upload.js -->
    </div>
    <div class="modal-footer" id="upload-footer" style="display:none">
      <button class="btn secondary" id="upload-back-btn" style="display:none">
        <span class="material-icons-round">arrow_back</span> 戻る
      </button>
      <button class="btn primary" id="upload-next-btn">
        次へ <span class="material-icons-round">arrow_forward</span>
      </button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-overlay" style="display:none">
  <div class="modal edit-modal">
    <div class="modal-header">
      <h3 class="modal-title">リザルト編集</h3>
      <button class="modal-close-btn" id="edit-close">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="modal-body" id="edit-body"></div>
    <div class="modal-footer">
      <button class="btn secondary" id="edit-cancel-btn">キャンセル</button>
      <button class="btn primary" id="edit-save-btn">保存</button>
    </div>
  </div>
</div>

<!-- Mode Select Modal -->
<div class="modal-overlay" id="mode-overlay" style="display:none">
  <div class="modal small-modal">
    <div class="modal-header">
      <h3 class="modal-title">判定モード</h3>
      <button class="modal-close-btn" id="mode-close">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div class="modal-body">
      <div class="mode-options">
        <button class="mode-option-btn" data-mode="ap">
          <div class="mode-option-title">AP基準</div>
          <div class="mode-option-desc">GREAT + GOOD + BAD + MISS</div>
        </button>
        <button class="mode-option-btn" data-mode="ap-tournament">
          <div class="mode-option-title">AP大会基準</div>
          <div class="mode-option-desc">GREAT×1 + GOOD×2 + BAD×3 + MISS×3</div>
        </button>
        <button class="mode-option-btn" data-mode="fc">
          <div class="mode-option-title">FC基準</div>
          <div class="mode-option-desc">GOOD + BAD + MISS</div>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="modal-overlay" id="confirm-overlay" style="display:none">
  <div class="modal small-modal">
    <div class="modal-body" style="padding:24px">
      <p class="confirm-title" id="confirm-title">確認</p>
      <p class="confirm-message" id="confirm-message"></p>
    </div>
    <div class="modal-footer">
      <button class="btn secondary" id="confirm-cancel">キャンセル</button>
      <button class="btn danger" id="confirm-ok">削除</button>
    </div>
  </div>
</div>

<!-- Notification container -->
<div id="notification-container" class="notification-container"></div>

<!-- Loading overlay -->
<div id="loading-overlay" class="loading-overlay" style="display:none">
  <div class="loading-spinner"></div>
  <p id="loading-text" class="loading-text">読み込み中...</p>
</div>

<!-- Scripts (order matters) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/music-db.js"></script>
<script src="js/auth.js"></script>
<script src="js/drive.js"></script>
<script src="js/ocr.js"></script>
<script src="js/filter-sort.js"></script>
<script src="js/virtual-scroll.js"></script>
<script src="js/card.js"></script>
<script src="js/notification.js"></script>
<script src="js/trash.js"></script>
<script src="js/upload.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
